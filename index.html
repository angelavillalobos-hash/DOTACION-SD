<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asistencia SD</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0d1a;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .wrap {
      background: #12121f;
      padding: 1.5rem;
      border-radius: 16px;
      width: 100%;
      max-width: 900px;
      border: 0.5px solid #2e2e4a;
    }

    /* ── Top bar ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 10px;
    }
    .topbar-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .logo-pill {
      background: #FFE600;
      border-radius: 8px;
      padding: 5px 14px;
      font-size: 15px;
      font-weight: 600;
      color: #12121f;
    }
    .sync-info { font-size: 11px; color: #7777aa; display: flex; align-items: center; gap: 5px; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #ffb300; flex-shrink: 0; }
    .topbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .sheet-link {
      font-size: 11px; color: #3483FA; text-decoration: none;
      display: flex; align-items: center; gap: 4px;
      border: 0.5px solid #2e2e4a; border-radius: 6px;
      padding: 4px 10px; background: #1e1e32; transition: all .15s;
    }
    .sheet-link:hover { border-color: #3483FA; color: #6ba4ff; }
    .btn-icon {
      padding: 4px 11px; border: 0.5px solid #2e2e4a; border-radius: 6px;
      background: #1e1e32; color: #7777aa; font-size: 11px; cursor: pointer;
      font-family: inherit; display: flex; align-items: center; gap: 4px;
      transition: all .15s;
    }
    .btn-icon:hover { border-color: #FFE600; color: #FFE600; }
    .btn-icon.blue:hover { border-color: #3483FA; color: #3483FA; }

    /* ── Date hero ── */
    .date-hero {
      text-align: center;
      padding: 0.9rem 0 0.85rem;
      border-bottom: 0.5px solid #2e2e4a;
      margin-bottom: 1.25rem;
    }
    .date-hero-main { font-size: 26px; font-weight: 500; color: #f0f0ff; text-transform: capitalize; letter-spacing: .3px; }
    .date-hero-sub { font-size: 12px; color: #5555aa; margin-top: 4px; }

    /* ── Filters ── */
    .filter-group { display: flex; gap: 6px; margin-bottom: 1.25rem; }
    .btn-filter {
      padding: 5px 16px; border: 0.5px solid #2e2e4a; border-radius: 6px;
      background: #1e1e32; color: #7777aa; font-size: 12px; cursor: pointer;
      font-family: inherit; transition: all .15s;
    }
    .btn-filter:hover { border-color: #FFE600; color: #FFE600; }
    .btn-filter.active { background: #FFE600; color: #12121f; border-color: #FFE600; font-weight: 600; }

    /* ── Metric cards ── */
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 1.25rem;
    }
    .mcard {
      background: #1e1e32; border-radius: 10px;
      padding: 14px 16px; border: 0.5px solid #2e2e4a;
      position: relative; overflow: hidden;
    }
    .mcard::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:#FFE600; }
    .mcard-label { font-size: 10px; color: #5555aa; text-transform: uppercase; letter-spacing: .7px; margin-bottom: 6px; }
    .mcard-val { font-size: 28px; font-weight: 500; color: #f0f0ff; line-height: 1; margin-bottom: 4px; }
    .mcard-sub { font-size: 11px; }
    .ok { color: #00d46a; } .warn { color: #ffb300; } .danger { color: #ff5252; }

    /* ── Panels / charts ── */
    .section { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1.25rem; }
    .panel {
      background: #1e1e32; border-radius: 10px;
      border: 0.5px solid #2e2e4a; padding: 14px 16px;
    }
    .panel-title {
      font-size: 10px; font-weight: 500; color: #5555aa;
      text-transform: uppercase; letter-spacing: .7px;
      border-bottom: 1px solid #2e2e4a; padding-bottom: 8px; margin-bottom: 12px;
    }
    .legend { display: flex; gap: 14px; margin-bottom: 10px; font-size: 11px; color: #5555aa; flex-wrap: wrap; }
    .legend span { display: flex; align-items: center; gap: 4px; }
    .ldot { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }

    /* ── Table ── */
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th {
      text-align: left; font-size: 10px; font-weight: 500; color: #5555aa;
      text-transform: uppercase; letter-spacing: .5px;
      padding: 6px 10px; background: #16162a; border-bottom: 1px solid #2e2e4a;
    }
    td { padding: 8px 10px; border-bottom: 0.5px solid #252540; color: #c0c0e8; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #252540; }
    .badge { display:inline-block; padding:2px 8px; border-radius:4px; font-size:10px; font-weight:500; }
    .badge-ok { background:#002a15; color:#00d46a; }
    .badge-warn { background:#2a1800; color:#ffb300; }
    .badge-danger { background:#2a0000; color:#ff5252; }
    .stn { font-size:10px; font-weight:600; background:#FFE600; color:#12121f; padding:2px 7px; border-radius:4px; }

    /* ── Spinner ── */
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .metrics { grid-template-columns: 1fr 1fr; }
      .section { grid-template-columns: 1fr; }
      .date-hero-main { font-size: 20px; }
    }
  </style>
</head>
<body>
<div class="wrap" id="dashRoot">

  <!-- Top bar -->
  <div class="topbar">
    <div class="topbar-left">
      <div class="logo-pill">Asistencia SD</div>
      <div class="sync-info">
        <span class="status-dot" id="statusDot"></span>
        <span id="syncLabel">Cargando...</span>
      </div>
    </div>
    <div class="topbar-right">
      <a class="sheet-link"
         href="https://docs.google.com/spreadsheets/d/1gvujSKMIj3Ilt46fdAOxGT05gtnLvsDBCKFMJ8bWbbI/edit"
         target="_blank" rel="noopener">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>
        </svg>
        Ver planilla
      </a>
      <button class="btn-icon" onclick="fetchSheet()" id="btnRefresh">
        <svg id="refreshIcon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M1 4v6h6M23 20v-6h-6"/>
          <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10M23 14l-4.64 4.36A9 9 0 0 1 3.51 15"/>
        </svg>
        Actualizar
      </button>
      <button class="btn-icon blue" onclick="downloadImage()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Descargar
      </button>
    </div>
  </div>

  <!-- Date hero -->
  <div class="date-hero">
    <div class="date-hero-main" id="dateHero">—</div>
    <div class="date-hero-sub">Reporte diario de dotación</div>
  </div>

  <!-- Filters -->
  <div class="filter-group">
    <button class="btn-filter active" onclick="setFilter('ambos')" id="btn-ambos">SRM1 + SRM2</button>
    <button class="btn-filter" onclick="setFilter('srm1')" id="btn-srm1">SRM1</button>
    <button class="btn-filter" onclick="setFilter('srm2')" id="btn-srm2">SRM2</button>
  </div>

  <!-- Metrics -->
  <div class="metrics" id="metrics"></div>

  <!-- Charts -->
  <div class="section">
    <div class="panel">
      <div class="panel-title">Capacidad real vs. solicitada</div>
      <div class="legend">
        <span><span class="ldot" style="background:#3483FA"></span>Cap. real</span>
        <span><span class="ldot" style="background:#1e3a5f"></span>Cap. solicitada</span>
      </div>
      <div style="position:relative;height:210px;">
        <canvas id="chartCap" role="img" aria-label="Capacidad real vs solicitada por categoría"></canvas>
      </div>
    </div>
    <div class="panel">
      <div class="panel-title">Ausentismo por ítem (%)</div>
      <div class="legend">
        <span><span class="ldot" style="background:#00d46a"></span>0%</span>
        <span><span class="ldot" style="background:#ffb300"></span>&lt; 10%</span>
        <span><span class="ldot" style="background:#ff5252"></span>≥ 10%</span>
      </div>
      <div style="position:relative;height:210px;">
        <canvas id="chartAus" role="img" aria-label="Ausentismo por ítem"></canvas>
      </div>
    </div>
  </div>

  <!-- Table -->
  <div class="panel">
    <div class="panel-title">Detalle por estación</div>
    <table>
      <thead>
        <tr>
          <th>Estación</th><th>Ítem</th><th>Cap. real</th>
          <th>Cap. solic.</th><th>Ausentes</th><th>Ausentismo</th><th>Observaciones</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

</div><!-- /.wrap -->

<script>
/* ─────────────────────────────────────────
   CONFIG  — cambia el SHEET_ID si lo mueves
   ───────────────────────────────────────── */
const SHEET_ID = '1gvujSKMIj3Ilt46fdAOxGT05gtnLvsDBCKFMJ8bWbbI';
const ITEMS    = ['Team Leader','Reps 2 (PS)','RTS','FT Meli','FT EST','PT EST','PT Meli'];

/* ── State ── */
let state = { srm1:[], srm2:[] };
let c1 = null, c2 = null, cur = 'ambos';

/* ── Fallback data (última lectura conocida) ── */
function useFallback() {
  state.srm1 = [
    {item:'Team Leader',  capReal:1,  capSol:1,  ausentes:0,  aus:0,    comentario:''},
    {item:'Reps 2 (PS)',  capReal:2,  capSol:3,  ausentes:-1, aus:33.3, comentario:'01 PS CON VACACIONES'},
    {item:'RTS',          capReal:2,  capSol:2,  ausentes:0,  aus:0,    comentario:''},
    {item:'FT Meli',      capReal:16, capSol:17, ausentes:-1, aus:5.9,  comentario:'Nicole Dueñas – Licencia médica'},
    {item:'FT EST',       capReal:15, capSol:16, ausentes:-1, aus:6.3,  comentario:'Ausencia injustificada Martín Suazo'},
    {item:'PT EST',       capReal:6,  capSol:6,  ausentes:0,  aus:0,    comentario:''},
    {item:'PT Meli',      capReal:1,  capSol:1,  ausentes:0,  aus:0,    comentario:''},
  ];
  state.srm2 = [
    {item:'Team Leader',  capReal:1,  capSol:1,  ausentes:0,  aus:0,    comentario:''},
    {item:'Reps 2 (PS)',  capReal:1,  capSol:1,  ausentes:0,  aus:0,    comentario:''},
    {item:'RTS',          capReal:0,  capSol:2,  ausentes:-2, aus:100,  comentario:''},
    {item:'FT Meli',      capReal:7,  capSol:7,  ausentes:0,  aus:0,    comentario:''},
    {item:'FT EST',       capReal:5,  capSol:5,  ausentes:0,  aus:0,    comentario:''},
    {item:'PT EST',       capReal:34, capSol:35, ausentes:-1, aus:2.9,  comentario:'Antonia Barbolan'},
    {item:'PT Meli',      capReal:0,  capSol:0,  ausentes:0,  aus:0,    comentario:''},
  ];
}

/* ── Parse helpers ── */
function parseNum(v) {
  if (!v) return 0;
  const n = parseFloat(v.replace(/[^0-9.\-]/g,'').replace(',','.'));
  return isNaN(n) ? 0 : n;
}
function parseRow(row) {
  return {
    item:      row[0].replace(/\\/g,''),
    capReal:   parseNum(row[1]),
    capSol:    parseNum(row[2]),
    ausentes:  parseNum(row[3]),
    aus:       parseNum(row[4]),
    comentario:row[5] || ''
  };
}
function parseSheet(text) {
  const tables = [];
  for (const block of text.split(/\n\n+/)) {
    const lines = block.trim().split('\n').filter(l=>l.includes('|'));
    if (lines.length < 3) continue;
    const rows = lines.slice(2)
      .map(l=>l.split('|').map(c=>c.trim()).filter((_,i,a)=>i>0&&i<a.length-1))
      .filter(r=>r.length>=5);
    if (rows.length) tables.push(rows);
    if (tables.length === 2) break;
  }
  return tables;
}

/* ── Fetch live data from Google Sheet via Anthropic MCP ── */
async function fetchSheet() {
  const icon      = document.getElementById('refreshIcon');
  const dot       = document.getElementById('statusDot');
  const syncLabel = document.getElementById('syncLabel');
  icon.classList.add('spin');
  syncLabel.textContent = 'Actualizando…';
  dot.style.background  = '#ffb300';

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model:       'claude-sonnet-4-20250514',
        max_tokens:  1000,
        mcp_servers: [{ type:'url', url:'https://drivemcp.googleapis.com/mcp/v1', name:'gdrive' }],
        messages: [{
          role:    'user',
          content: `Read Google Drive file ID: ${SHEET_ID}. Return ONLY the raw markdown tables for the first two tables (dotacion SRM1 and dotacion SRM2), nothing else.`
        }]
      })
    });
    const data   = await res.json();
    const joined = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n\n');
    const tables = parseSheet(joined);

    if (tables.length >= 2) {
      state.srm1 = tables[0].slice(0,-1).map(parseRow).filter(r=>ITEMS.includes(r.item));
      state.srm2 = tables[1].slice(0,-1).map(parseRow).filter(r=>ITEMS.includes(r.item));
      const t    = new Date();
      syncLabel.textContent = 'Actualizado ' + t.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
      dot.style.background  = '#00d46a';
    } else {
      throw new Error('tablas no encontradas');
    }
  } catch(e) {
    useFallback();
    syncLabel.textContent = 'Datos locales (sin conexión)';
    dot.style.background  = '#ff5252';
  }

  icon.classList.remove('spin');
  render();
}

/* ── Data helpers ── */
function calcTotal(rows) {
  const capReal  = rows.reduce((s,r)=>s+r.capReal, 0);
  const capSol   = rows.reduce((s,r)=>s+r.capSol,  0);
  const ausentes = rows.reduce((s,r)=>s+r.ausentes, 0);
  return { capReal, capSol, ausentes, aus: capSol>0 ? (Math.abs(ausentes)/capSol)*100 : 0 };
}
function getFD() {
  if (cur==='srm1') return { rows:state.srm1, total:calcTotal(state.srm1), lbl:'SRM1' };
  if (cur==='srm2') return { rows:state.srm2, total:calcTotal(state.srm2), lbl:'SRM2' };
  const combined = state.srm1.map((r,i)=>{
    const r2 = state.srm2[i] || {};
    const cs = r.capSol + (r2.capSol||0);
    return {
      item:       r.item,
      capReal:    r.capReal   + (r2.capReal||0),
      capSol:     cs,
      ausentes:   r.ausentes  + (r2.ausentes||0),
      aus:        cs>0 ? (Math.abs(r.ausentes+(r2.ausentes||0))/cs)*100 : 0,
      comentario: [r.comentario, r2.comentario].filter(Boolean).join(' / ')
    };
  });
  return { rows:combined, total:calcTotal(combined), lbl:'SRM1+SRM2' };
}

/* ── Render helpers ── */
function renderMetrics() {
  const { total:t } = getFD();
  const ac  = t.aus<=5 ? 'ok' : t.aus<=10 ? 'warn' : 'danger';
  const cob = Math.round((t.capReal/t.capSol)*100);
  document.getElementById('metrics').innerHTML = `
    <div class="mcard">
      <div class="mcard-label">Cap. real</div>
      <div class="mcard-val">${t.capReal}</div>
      <div class="mcard-sub" style="color:#5555aa">presentes</div>
    </div>
    <div class="mcard">
      <div class="mcard-label">Cap. solicitada</div>
      <div class="mcard-val">${t.capSol}</div>
      <div class="mcard-sub" style="color:#5555aa">requeridos</div>
    </div>
    <div class="mcard">
      <div class="mcard-label">Ausentes</div>
      <div class="mcard-val">${Math.abs(t.ausentes)}</div>
      <div class="mcard-sub ${ac}">${t.aus.toFixed(1)}% ausentismo</div>
    </div>
    <div class="mcard">
      <div class="mcard-label">Cobertura</div>
      <div class="mcard-val">${cob}%</div>
      <div class="mcard-sub ${cob>=100?'ok':'warn'}">${cob>=100?'Completa':'Con faltantes'}</div>
    </div>`;
}

/* shared plugin: value labels on top of bars */
const barLabelPlugin = {
  id: 'barLabel',
  afterDatasetsDraw(chart) {
    const { ctx } = chart;
    chart.data.datasets.forEach((ds, di) => {
      if (ds.type === 'line') return;
      chart.getDatasetMeta(di).data.forEach((bar, i) => {
        const v = ds.data[i];
        if (!v && v !== 0) return;
        ctx.save();
        ctx.fillStyle   = '#c0c0e8';
        ctx.font        = '500 10px sans-serif';
        ctx.textAlign   = 'center';
        ctx.fillText(v, bar.x, bar.y - 4);
        ctx.restore();
      });
    });
  }
};

function renderBar() {
  const { rows } = getFD();
  const r = rows.filter(x=>x.capSol>0);
  if (c1) c1.destroy();
  c1 = new Chart(document.getElementById('chartCap'), {
    type: 'bar',
    data: {
      labels:   r.map(x=>x.item),
      datasets: [
        { label:'Cap. real',      data:r.map(x=>x.capReal), backgroundColor:'#3483FA', borderRadius:3 },
        { label:'Cap. solicitada',data:r.map(x=>x.capSol),  backgroundColor:'#1e3a5f', borderRadius:3 }
      ]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ display:false } },
      scales:{
        x:{ ticks:{font:{size:10},color:'#5555aa',autoSkip:false,maxRotation:30}, grid:{display:false}, border:{color:'#2e2e4a'} },
        y:{ ticks:{font:{size:10},color:'#5555aa'}, beginAtZero:true, grid:{color:'#1e1e32'}, border:{color:'#2e2e4a'} }
      }
    },
    plugins:[barLabelPlugin]
  });
}

function renderAus() {
  const { rows } = getFD();
  const r = rows.filter(x=>x.capSol>0);
  const ausLabelPlugin = {
    id: 'ausLabel',
    afterDatasetsDraw(chart) {
      const { ctx } = chart;
      chart.getDatasetMeta(0).data.forEach((bar,i)=>{
        const v = chart.data.datasets[0].data[i];
        ctx.save();
        ctx.fillStyle = '#c0c0e8';
        ctx.font      = '500 10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(v+'%', bar.x, bar.y-4);
        ctx.restore();
      });
    }
  };
  if (c2) c2.destroy();
  c2 = new Chart(document.getElementById('chartAus'), {
    type: 'bar',
    data: {
      labels:   r.map(x=>x.item),
      datasets:[{
        label:'% Ausentismo',
        data: r.map(x=>+x.aus.toFixed(1)),
        backgroundColor: r.map(x=> x.aus===0?'#00d46a': x.aus<10?'#ffb300':'#ff5252'),
        borderRadius: 3
      }]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ display:false } },
      scales:{
        x:{ ticks:{font:{size:10},color:'#5555aa',autoSkip:false,maxRotation:30}, grid:{display:false}, border:{color:'#2e2e4a'} },
        y:{ ticks:{font:{size:10},color:'#5555aa',callback:v=>v+'%'}, beginAtZero:true, grid:{color:'#1e1e32'}, border:{color:'#2e2e4a'} }
      }
    },
    plugins:[ausLabelPlugin]
  });
}

function renderTable() {
  const { rows, lbl } = getFD();
  document.getElementById('tbody').innerHTML = rows.map(r=>{
    const ac = r.aus===0?'badge-ok': r.aus<10?'badge-warn':'badge-danger';
    return `<tr>
      <td><span class="stn">${lbl}</span></td>
      <td style="font-weight:500;color:#e0e0f8">${r.item}</td>
      <td>${r.capReal}</td>
      <td>${r.capSol}</td>
      <td>${Math.abs(r.ausentes)}</td>
      <td><span class="badge ${ac}">${r.aus.toFixed(1)}%</span></td>
      <td style="color:#5555aa;font-size:11px">${r.comentario||'—'}</td>
    </tr>`;
  }).join('');
}

function render() { renderMetrics(); renderBar(); renderAus(); renderTable(); }

function setFilter(f) {
  cur = f;
  ['ambos','srm1','srm2'].forEach(id=>
    document.getElementById('btn-'+id).classList.toggle('active', id===f)
  );
  render();
}

/* ── Download as PNG ── */
async function downloadImage() {
  const btn = document.querySelector('.btn-icon.blue');
  btn.textContent = 'Generando…';
  try {
    const canvas = await html2canvas(document.getElementById('dashRoot'), {
      backgroundColor:'#12121f', scale:2, useCORS:true, logging:false
    });
    const a = document.createElement('a');
    a.download = 'asistencia_sd_' + new Date().toISOString().slice(0,10) + '.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  } catch(e) {
    alert('Error al generar imagen. Intenta nuevamente.');
  }
